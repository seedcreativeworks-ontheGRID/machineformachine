name: Deploy to GitHub Pages

# Publishes public/ to the gh-pages branch (Settings -> Pages -> Source:
# "Deploy from a branch" -> Branch: gh-pages, Folder: / (root)).
#
# This repo's Actions-based Pages deployment (configure-pages /
# upload-pages-artifact / deploy-pages) has failed on every attempt —
# the job never even reaches a runner, regardless of what Settings ->
# Pages -> Source shows. This branch-based method is the one that has
# actually deployed successfully, repeatedly, in this repo. Trade-off:
# GitHub's CDN for a branch-based Pages site purges on a timer rather
# than on push (documented as up to ~10 minutes), so a change can take a
# few minutes to show up live even after this workflow succeeds — that's
# expected, not a failure.

on:
  push:
    branches: [main, claude/end-to-end-repo-setup-komc9y]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point the frontend at the API backend
        # GALLEY_API_BASE_URL is a repo/environment variable (Settings ->
        # Secrets and variables -> Actions -> Variables), e.g.
        # https://your-project.vercel.app. Left unset, the chat panel will
        # fail closed with "Signal's down" instead of crashing — see
        # README.md "Hosting the frontend on GitHub Pages".
        run: |
          cat > public/config.js <<EOF
          window.GALLEY_CONFIG = {
            apiBase: "${{ vars.GALLEY_API_BASE_URL }}"
          };
          EOF

      - name: Cache-bust static assets for this deploy
        # style.css/app.js/config.js/the mp3 all live at fixed filenames,
        # so a browser can keep an old cached copy after a new deploy.
        # Tag each reference with the commit SHA so every deploy is a
        # distinct URL.
        run: |
          sed -i \
            -e "s/style\.css\"/style.css?v=${GITHUB_SHA}\"/" \
            -e "s/config\.js\"/config.js?v=${GITHUB_SHA}\"/" \
            -e "s/app\.js\" defer/app.js?v=${GITHUB_SHA}\" defer/" \
            -e "s#audio/how-to-use\.mp3\"#audio/how-to-use.mp3?v=${GITHUB_SHA}\"#" \
            public/index.html

      - name: Publish public/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
