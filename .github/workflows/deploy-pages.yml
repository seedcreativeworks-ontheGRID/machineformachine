name: Deploy to GitHub Pages

# Publishes public/ to the gh-pages branch, which GitHub Pages is
# configured to serve from directly (Settings -> Pages -> Source:
# "Deploy from a branch" -> Branch: gh-pages, Folder: / (root)).
#
# The gh-pages branch is created automatically on first run — nothing to
# set up on that branch ahead of time. After the first successful run,
# go select it in Settings -> Pages if it isn't already selected there.

on:
  push:
    branches: [main, claude/end-to-end-repo-setup-komc9y]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point the frontend at the API backend
        # GALLEY_API_BASE_URL is a repo/environment variable (Settings ->
        # Secrets and variables -> Actions -> Variables), e.g.
        # https://your-project.vercel.app. Left unset, the chat panel will
        # fail closed with "Signal's down" instead of crashing — see
        # README.md "Hosting the frontend on GitHub Pages".
        run: |
          cat > public/config.js <<EOF
          window.GALLEY_CONFIG = {
            apiBase: "${{ vars.GALLEY_API_BASE_URL }}"
          };
          EOF

      - name: Publish public/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
