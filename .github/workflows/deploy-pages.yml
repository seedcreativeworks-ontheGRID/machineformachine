name: Deploy to GitHub Pages

# Publishes public/ via GitHub's official Actions-based Pages deployment
# (Settings -> Pages -> Source: "GitHub Actions").
#
# This is deliberately NOT the "Deploy from a branch" method. Branch-based
# deploys are served through a CDN cache that only expires on a timer
# (documented as up to ~10 minutes) — every push looks "broken" for a
# while even though the deploy itself succeeded. The Actions-based method
# actively purges that cache on every run, so a finished deploy is live
# immediately. If Settings -> Pages -> Source is still "Deploy from a
# branch", switch it to "GitHub Actions" once — this workflow can't do
# that repo setting for you.

on:
  push:
    branches: [main, claude/end-to-end-repo-setup-komc9y]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point the frontend at the API backend
        # GALLEY_API_BASE_URL is a repo/environment variable (Settings ->
        # Secrets and variables -> Actions -> Variables), e.g.
        # https://your-project.vercel.app. Left unset, the chat panel will
        # fail closed with "Signal's down" instead of crashing — see
        # README.md "Hosting the frontend on GitHub Pages".
        run: |
          cat > public/config.js <<EOF
          window.GALLEY_CONFIG = {
            apiBase: "${{ vars.GALLEY_API_BASE_URL }}"
          };
          EOF

      - name: Cache-bust static assets for this deploy
        # Belt-and-suspenders: the CDN purge above handles index.html
        # itself, but browsers can still hold an old style.css/app.js in
        # their own disk cache. Tag each reference with the commit SHA so
        # every deploy is also a distinct sub-resource URL.
        run: |
          sed -i \
            -e "s/style\.css\"/style.css?v=${GITHUB_SHA}\"/" \
            -e "s/config\.js\"/config.js?v=${GITHUB_SHA}\"/" \
            -e "s/app\.js\" defer/app.js?v=${GITHUB_SHA}\" defer/" \
            -e "s#audio/how-to-use\.mp3\"#audio/how-to-use.mp3?v=${GITHUB_SHA}\"#" \
            public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload public/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
